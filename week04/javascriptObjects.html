<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Javascript Object Learning activity">
    <meta name="author" content="Grady Petersen">
    <title>Javascript Objects</title>
    <link rel="stylesheet" href="styles/table.css">
    <script src="scripts/javascriptObjects.js" defer></script>
</head>

<body>
    <table id="sections">
        <caption>Dynamic Table</caption>
        <thead>
            <tr>
                <th id="courseName" colspan="4" scope="colgroup">ACME Wildwest Service</th>
            </tr>
        </thead>
        <tbody> <!--dynamically updated in javascriptObjects.js-->
            <tr>
                <th scope="row">Feature 1</th>
                <td>✔</td>
                <td>✔</td>
                <td>✔</td>
            </tr>
            <tr>
                <th scope="row">Feature 2</th>
                <td>❌</td>
                <td>✔</td>
                <td>✔</td>
            </tr>
            <tr>
                <th scope="row">Feature 3</th>
                <td>❌</td>
                <td>❌</td>
                <td>✔</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
